[platformio]
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<*.ino> +<*.cpp> +<*.c> +<*.h> -<venv/> -<bridge.py>
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
